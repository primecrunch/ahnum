name: ci

# Build and test on GitHub's Apple Silicon runners (M1, macOS 14 and 15): an older chip and
# older macOS than the M4 / macOS 27 machines ahnum is developed on. Correctness only; the
# runners are virtualised, so timings mean nothing. The SME tests skip on M1 (no SME).
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: sw_vers && sysctl -n machdep.cpu.brand_string hw.ncpu
      - name: Install GMP (for the test_gmp checks)
        run: brew install gmp
      - name: Build
        run: cmake -S . -B build && make -C build -j3
      - name: Test
        run: cd build && ctest -LE long --output-on-failure
